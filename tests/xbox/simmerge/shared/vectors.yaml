# The merge arithmetic, defined ONCE as golden vectors (docs/decisions.md O-47; work/0031).
#
# Source of the rules: xemu-vr-8d's XB-6 rules for PenguinBox's merge layer, under the owner's "go with your
# recommendations" (relayed 2026-11-15; the owner's go covered the four headlines O-07 rounding, O-15 policies,
# O-16 response, O-23 integrate, and the details are xemu-vr-8d's). The app's previews (profile/merge.py,
# profile/relative.py, ui/axis_response.py) are tested against this file by tests/test_merge_vectors.py.
# PenguinBox's merge-layer test (XB-6) vendors this file BY ITS SHA256; a change here is a new sha both sides take.
#
# The chain for one axis binding (kind axis / split):
#   normalised  the source's raw value through Range.normalise, on the calibration's min/rest/max when one is given
#               (it replaces the descriptor's); bipolar [-1, 1] (each side scaled on its own), unipolar [0, 1]
#   shaped      O-16 on the source's own c or u: 1 binding invert (c -> -c, u -> 1 - u); 2 m = |c| or u, s its sign;
#               3 L = max(window_lo, deadzone), m = clamp((m - L) / (window_hi - L), 0, 1); 4 m = min(m / saturation, 1);
#               5 m = m ^ curve; 6 s * m. Defaults: window [0, 1], deadzone 0, saturation 1, curve 1, invert false.
#   mapped      O-15 across polarity (equal to shaped when source and target agree). bipolar c -> unipolar u:
#               half_positive max(c, 0); half_negative max(-c, 0); absolute |c|; full_range (c + 1) / 2;
#               split: targets[0] max(c, 0), targets[1] max(-c, 0). unipolar u -> bipolar c: half_positive u;
#               half_negative -u; full_range 2u - 1; absolute u.
#   value       Range.denormalise on the target, continuous
#   rounded     O-07: the nearest integer, halves away from the target's rest
# kind integrate (O-23): p starts at the target's rest; a motion of d counts adds d * (max - min) / counts_per_travel,
#   negated by invert; clamped to [min, max] with no wind-up; "recentre" sets p = rest; positions[i] and rounded[i]
#   are p after steps[i], continuous and rounded (O-07).
# kind round (O-07): value -> rounded on target.  kind sbc_byte (O-07, the merge layer's SBC aiming byte):
#   axis = wire - 0x8000, byte = 128 + floor(axis / 256).
#
# Continuous fields compare within `tolerance` (absolute); rounded fields and bytes compare exactly. The arithmetic is
# IEEE-754 DOUBLE throughout, in the order written above (a float32 port misses the tolerance, worst 1.95e-3). A
# vector's continuous value sits on an exact half only where every step is exact in binary (e.g. (0.5 - 0.1) / 0.8 =
# 0.5 exactly); (0.6 - 0.2) / 0.8 is 0.49999999999999994 in double, so no vector rounds a value like that.
# `shaped` and `mapped` assume the response runs BEFORE the policy (XB-6's order, xemu-vr-8d's answer 1; half_positive
# with invert gives max(-c, 0)). A vector's optional `source_invert: true` is the source descriptor's own invert
# (answer 3): on c or u after normalising and clamping (the calibrated range when there is one), before the binding's
# response; `normalised` is the value before that invert. normalise clamps bipolar c to [-1, 1] and unipolar u to
# [0, 1] right after normalising (answer a), so a raw beyond the calibrated range gives exactly -1, +1, 0 or 1.
# A policy between two ranges of the SAME polarity is ignored (answer 7); `split` applies always: from a bipolar c
# targets[0] gets max(c, 0) and targets[1] max(-c, 0), from a unipolar u targets[0] gets the shaped u and targets[1]
# 0, and a bipolar target uses rest..max only (answer 2). Rounding v >= rest ? floor(v + 0.5) : ceil(v - 0.5)
# (answer 6): a value exactly at a half-integer rest goes up (rest 2.5, v 2.5 -> 3).
# Source of the follow-up rules: xemu-vr-8d's answers 1-7 and a-c, details under the owner's go, 2026-11-15.
# Left out on purpose: deadzone outside [0, window_hi), saturation outside (0, 1] and curve <= 0 (the validator refuses
# all three in both apps, S-71, the owner's "go with a", 2026-11-15: RESPONSE_DEADZONE, RESPONSE_SATURATION,
# RESPONSE_CURVE, with shared bad fixtures 35-37; no vector); XB-6's end-to-end check compares only value and rounded.
#
# ---- S-74 (2026-11-15): a BUTTON bound to an AXIS and an AXIS bound to a BUTTON, time-stepped.
# The owner ruled the behaviour (decisions.md S-74: spring-back "go to X% while held", stay-put "move at a rate while
# held", optional ramp, two keys on one axis "last pressed wins", axis -> button with threshold and hysteresis). The
# exact rules below (field units, the step rule, the ramp's slope, arbitration mid-ramp) are the app lane's PROPOSAL,
# not yet ruled: see S-74's open items. The expected values were computed in exact rational arithmetic from this text
# (not from profile/merge.py), then checked against merge.py's doubles.
# kind button_axis: every button -> axis binding on ONE target control, keyed by name in `bindings`.
#   returns_to_rest true (spring-back, the target file's default): each binding has `value`, the canonical position
#     while its key is held (bipolar -1..1, unipolar 0..1, 0 = rest), and an optional `ramp: { press_ms, release_ms }`
#     (absent or 0 = instant). The state y is canonical, starting at 0 (rest); the output is denormalise(y).
#     The driver (below) sets the goal: its `value`; with no key held the goal is 0 (rest). y moves toward the goal in a
#     straight line at |value| / press_ms per ms of the binding that drives (going to a held key's value) or at
#     |value| / release_ms of the binding that drove last (going back to rest), computed as dt_ms * |value| / ms; it
#     stops at the goal. A ms of 0 jumps to the goal.
#   returns_to_rest false (stay-put, e.g. the SBC aiming lever): each binding has `rate`, full travels (min to max) per
#     second, signed: + toward max ("full travel in N s" is rate 1/N). The state p is raw, starting at the target's
#     rest; while a key drives, p += rate * dt_ms * (max - min) / 1000 (in that order), clamped to [min, max] with no
#     wind-up; with none held p stays where it is. No `value`, no `ramp`.
#   Last pressed wins: the held keys are kept in press order; the most recently pressed one drives; when it is released
#     the most recent one still held takes over; none held: back to rest (spring-back) or stays (stay-put).
#   The step rule: each step is { dt_ms, held }. First time advances by dt_ms with the keys as they were (the previous
#     step's `held`), piecewise linear; then the keys are read: keys no longer listed are released, newly listed keys
#     are pressed in BINDING order: keys first seen pressed in the same step join in the order of their bindings
#     (the `bindings` mapping's order in this file; the later binding counts as pressed later; the owner, 2026-11-15:
#     "binding order", what an emulator that polls its keys can see); then a 0 ms ramp jumps at once.
#     values[i] and rounded[i] are the output after step i (continuous, then rounded as O-07). Before step 0 no key is
#     held and the output is at rest.
# kind axis_button: one axis bound to a digital button. o = the source's normalised c or u (clamped), through the
#   binding's `invert` when set (c -> -c, u -> 1 - u). `threshold` is canonical and its sign picks the direction:
#   threshold > 0: released -> pressed when o >= threshold; pressed -> released when o < threshold - hysteresis.
#   threshold < 0 mirrors it: pressed when o <= threshold; released when o > threshold + hysteresis. The button
#   starts released; pressed[i] is the state after raws[i]. Every edge in these vectors is exact in binary.
#
# ---- S-75 (2026-11-15): the owner's two rulings on the S-74 bindings, both what PenguinBox's XB-6 already does.
# "go with yes" (decisions.md S-75): kind axis_button takes the source descriptor's own invert. A vector's optional
#   `source_invert: true` flips o first (c -> -c, u -> 1 - u, on the normalised, clamped value, as in the axis chain),
#   then the binding's `invert`; both set cancel. The threshold and hysteresis then act on that o, as above.
# "I want you to do one shared position" (S-75): kind stay_put is ONE stay-put target control and the ONE position p
#   that every rate key (`rates`, as button_axis's stay-put bindings) and every integrate (mouse) binding on it moves.
#   The in-update order is XB-6's rules as implemented (xemu-vr-8d, relayed 2026-11-15), under the owner's go:
#   p starts at the target's rest. One step { dt_ms, counts, held } goes:
#   1 rate: the key that was driving BEFORE this step (the last pressed, the previous step's `held`) adds
#     p += rate * dt_ms * (max - min) / 1000, clamped to [min, max] (no wind-up); none held: no change;
#   2 integrate, the bindings in `integrates` list order (= document order): one with counts in this step's `counts`
#     adds p += counts * (max - min) / counts_per_travel, negated when exactly one of its `invert` and `source_invert`
#     (the device descriptor's) is set (both set cancel), clamped after EACH binding;
#   3 right after a binding's own counts, if its `recentre` button is in this step's `held`, p = rest: it wins over this
#     step's rate and that binding's motion, and a later binding in the list still adds its counts from rest;
#   4 the keys are read: rate keys not in `held` leave the press order, newly pressed ones join it in binding order
#     (as above). Reading keys does not move p.
#   values[i] and rounded[i] are p after step i, continuous and rounded (O-07, halves away from rest). Expected values
#   were computed in exact rational arithmetic from this text, not from profile/merge.py.
#
# ---- S-80 and S-81 (2026-11-15): a LEVER (detent) on a button or a lever, a HAT on a button.
# The owner ruled decision 4, "(a) Define it, with the value passing straight through" (a lever bound to a lever with
#   the same positions), and decision 6, "(a) Adopt what PenguinBox built: left and up negative, a diagonal presses
#   both". The exact rules below are the coordinator's PROPOSAL under those rulings (decisions.md S-80, S-81).
# A position, and a lever's reading, is an integer or a text string, as PyYAML (YAML 1.1 core) types the plain scalar:
#   1 is the integer 1; "1", n and r are text. Positions and readings compare by type AND value: the integer 1 never
#   matches the text "1". A bool or a float position is refused (DETENT_POSITIONS), so no vector has one.
# kind detent_button: one lever bound to one button with the binding's `position` (one of `positions`). pressed[i] is
#   true exactly when readings[i] equals that position by type and value; any other reading, one that is not a position
#   at all included (the gear lever's 0 between gears), is released.
# kind detent_detent: a lever bound to a lever with the SAME positions (equal lists, same order, by type and value;
#   the validator refuses any other pair, DETENT_POSITIONS_DIFFER). values[i] is readings[i], passed straight through
#   UNCHANGED, type kept, also a reading that is not one of the positions: the gear lever's 0 between gears reaches the
#   target as 0 (the owner, 2026-11-15, "option c": the game sees exactly what a real Xbox would).
# kind hat_button: a hat is two axes, x on its `code` (ABS_HAT<n>X) and y on code + 1; readings[i] is [x, y]. Only the
#   sign is read: left is x < 0, right x > 0, up y < 0, down y > 0, and 0 is neither. A hat -> button binding with
#   `direction` is pressed while that direction is held, so a diagonal presses both of its bound directions; a
#   direction with no binding presses nothing. pressed[i] is the binding's state for readings[i].
format: 1
tolerance: 1.0e-6

ranges:   # named here for reading only; every vector spells its ranges out
  steering: { min: -32768, rest: 0, max: 32767 }      # a bipolar wheel / the Duke's sticks
  stick:    { min: -32768, rest: 0, max: 32767 }
  trigger:  { min: 0, rest: 0, max: 255 }             # the Duke's analog triggers
  pedal:    { min: 0, rest: 0, max: 1000 }
  accel:    { min: -32768, rest: -32768, max: 32767 } # a unipolar pedal reported on a signed axis
  aiming:   { min: 0, rest: 32768, max: 65535 }       # the SBC's aiming lever (wire units)

vectors:
  # ---- O-15: bipolar -> unipolar, identity response
  - { id: b2u-half_positive-worked, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: half_positive }, target: { min: 0, rest: 0, max: 255 }, raw: 16384,
      expect: { normalised: 0.500015259, shaped: 0.500015259, mapped: 0.500015259, value: 127.503891110, rounded: 128 } }
  - { id: b2u-half_positive-negative-side, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: half_positive }, target: { min: 0, rest: 0, max: 255 }, raw: -16384,
      expect: { normalised: -0.5, shaped: -0.5, mapped: 0.0, value: 0.0, rounded: 0 } }
  - { id: b2u-half_negative, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: half_negative }, target: { min: 0, rest: 0, max: 255 }, raw: -16384,
      expect: { normalised: -0.5, shaped: -0.5, mapped: 0.5, value: 127.5, rounded: 128 } }
  - { id: b2u-half_negative-positive-side, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: half_negative }, target: { min: 0, rest: 0, max: 255 }, raw: 16384,
      expect: { normalised: 0.500015259, shaped: 0.500015259, mapped: 0.0, value: 0.0, rounded: 0 } }
  - { id: b2u-absolute-negative, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: absolute }, target: { min: 0, rest: 0, max: 255 }, raw: -8192,
      expect: { normalised: -0.25, shaped: -0.25, mapped: 0.25, value: 63.75, rounded: 64 } }
  - { id: b2u-absolute-positive, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: absolute }, target: { min: 0, rest: 0, max: 255 }, raw: 16384,
      expect: { normalised: 0.500015259, shaped: 0.500015259, mapped: 0.500015259, value: 127.503891110, rounded: 128 } }
  - { id: b2u-full_range-worked, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: full_range }, target: { min: 0, rest: 0, max: 255 }, raw: -16384,
      expect: { normalised: -0.5, shaped: -0.5, mapped: 0.25, value: 63.75, rounded: 64 } }
  - { id: b2u-full_range-at-rest-worked, rule: O-15+O-07, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: full_range }, target: { min: 0, rest: 0, max: 255 }, raw: 0,
      expect: { normalised: 0.0, shaped: 0.0, mapped: 0.5, value: 127.5, rounded: 128 } }
  - { id: b2u-full_range-max, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: full_range }, target: { min: 0, rest: 0, max: 255 }, raw: 32767,
      expect: { normalised: 1.0, shaped: 1.0, mapped: 1.0, value: 255.0, rounded: 255 } }
  - { id: b2u-full_range-min, rule: O-15, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: full_range }, target: { min: 0, rest: 0, max: 255 }, raw: -32768,
      expect: { normalised: -1.0, shaped: -1.0, mapped: 0.0, value: 0.0, rounded: 0 } }
  # ---- O-15: split, one bipolar source onto two unipolar targets
  - { id: split-positive, rule: O-15, kind: split, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: split }, targets: [ { min: 0, rest: 0, max: 255 }, { min: 0, rest: 0, max: 255 } ], raw: 16384,
      expect: { normalised: 0.500015259, shaped: 0.500015259, mapped: [ 0.500015259, 0.0 ], value: [ 127.503891110, 0.0 ], rounded: [ 128, 0 ] } }
  - { id: split-negative, rule: O-15, kind: split, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: split }, targets: [ { min: 0, rest: 0, max: 255 }, { min: 0, rest: 0, max: 255 } ], raw: -16384,
