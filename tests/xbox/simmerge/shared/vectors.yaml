      expect: { normalised: -0.25, shaped: -0.25, mapped: [ 0.0, 0.25 ], value: [ 0.0, 250.0 ], rounded: [ 0, 250 ] } }
  # ---- O-15: unipolar -> bipolar, identity response
  - { id: u2b-half_positive, rule: O-15+O-07, kind: axis, source: { min: 0, rest: 0, max: 1000 }, binding: { policy: half_positive }, target: { min: -32768, rest: 0, max: 32767 }, raw: 500,
