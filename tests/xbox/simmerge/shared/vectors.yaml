  - { id: u2b-half_negative, rule: O-15, kind: axis, source: { min: 0, rest: 0, max: 1000 }, binding: { policy: half_negative }, target: { min: -32768, rest: 0, max: 32767 }, raw: 250,
      expect: { normalised: 0.25, shaped: 0.25, mapped: -0.25, value: -8192.0, rounded: -8192 } }
  - { id: u2b-absolute, rule: O-15, kind: axis, source: { min: 0, rest: 0, max: 1000 }, binding: { policy: absolute }, target: { min: -32768, rest: 0, max: 32767 }, raw: 500,
      expect: { normalised: 0.5, shaped: 0.5, mapped: 0.5, value: 16383.5, rounded: 16384 } }
  - { id: u2b-full_range-mid, rule: O-15, kind: axis, source: { min: 0, rest: 0, max: 1000 }, binding: { policy: full_range }, target: { min: -32768, rest: 0, max: 32767 }, raw: 500,
