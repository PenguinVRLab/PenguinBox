  - { id: b2u-half_negative-curve, rule: O-15+O-16, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: half_negative, curve: 2 }, target: { min: 0, rest: 0, max: 255 }, raw: -16384,
      expect: { normalised: -0.5, shaped: -0.25, mapped: 0.25, value: 63.75, rounded: 64 } }
  - { id: b2u-absolute-saturation, rule: O-15+O-16, kind: axis, source: { min: -32768, rest: 0, max: 32767 }, binding: { policy: absolute, saturation: 0.5 }, target: { min: 0, rest: 0, max: 255 }, raw: -8192,
      expect: { normalised: -0.25, shaped: -0.5, mapped: 0.5, value: 127.5, rounded: 128 } }
