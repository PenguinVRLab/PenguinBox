# BAD fixture (work/0039): bindings_wheel.yaml with one change: the steering response's invert is text. Load the good set with this file IN PLACE OF
# bindings_wheel.yaml; it must be refused with INVERT_TYPE.
schema: sim-profile/1
kind: bindings
id: pgr2_wheel
device: wheel
target: xbox_duke
bind:
- source: steering
  target: left_stick_x
  response:
    invert: 'yes'
- source: paddle_up
  target: a
- source: paddle_down
  target: b
- source: pov
  target: dpad_up
  direction: up
