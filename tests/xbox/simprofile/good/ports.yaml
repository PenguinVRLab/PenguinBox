# The ports (work/0022; the owner, 2026-10-09: "Port owns the controller"). Each port: its emulated controller, the
# person's devices (and which physical unit each is), and its profile (the mapping; none is a valid state).
# Port 3 is a Duke port with nothing on it yet; port 4 is off.
schema: sim-profile/1
kind: ports
id: living_room
ports:
  1:
    target: xbox_duke
    profile: pgr2_racing
    devices:
      - { device: wheel, position: centre, port_path: "pci-0000:00:14.0-usb-0:1:1.0" }
      - { device: racing_pedals, position: floor }
      - { device: th8a, position: right }
      - { device: sinden_pedal, position: floor }
  2:
    target: steel_battalion
    profile: sbc_real
    last_used: { 0x43430002: sbc_real }    # work/0029: written by the app when a profile is used for a title
    devices:
      - { device: sbc_wire }
  3: { target: xbox_duke }
