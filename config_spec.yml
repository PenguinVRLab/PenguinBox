vr:
  enable:
    type: bool
    default: false
  screen_distance:
    type: float
    default: 2.0
  screen_height:
    type: float
    default: 1.4
  screen_arc:
    type: float
    default: 0.0
  screen_vertical_offset:
    type: float
    default: 0.0
  headlook_enable:
    type: bool
    default: false
  headlook_sensitivity:
    type: float
    default: 1.0
  headlook_invert_pitch:
    type: bool
    default: false
  headlook_engine_period:
    type: float
    default: 0.0
  headlook_yaw_addr:
    type: string
    default: ''
  headlook_pitch_addr:
    type: string
    default: ''
  headlook_gate_addr:
    type: string
    default: ''
  headlook_gate_value:
    type: integer
    default: 1
  headlook_gate_mask:
    type: integer
    default: 255
  headlook_base_mode:
    type: string
    default: ''
  headlook_base_ptr:
    type: string
    default: ''
  headlook_base_offset:
    type: integer
    default: 0
  headlook_base_aob:
    type: string
    default: ''
  headlook_base_scan_start:
    type: integer
    default: 65536
  headlook_base_scan_end:
    type: integer
    default: 0
  headlook_base_validate_offset:
    type: integer
    default: 0
  headlook_base_validate_equals:
    type: integer
    default: 0
  # The game's pitch limits, in its units (directLook, Halo: +-1.4923 rad):
  # the written pitch is clamped to them so the game never clamps it itself
  # (a game-side clamp would be folded into the base as a stick move and the
  # view would drift). Off while max <= min.
  headlook_pitch_min:
    type: float
    default: 0.0
  headlook_pitch_max:
    type: float
    default: 0.0
  # The free projection (hw/xbox/nv2a/pgraph/vr_worldproj.c): `projection`
  # renders the world through the headset's frustum and pose for a title with
  # a row in vr_worldproj_profiles.c; any other title stays on the screen. A
  # control file named by XEMU_VR_WORLDPROJ overrides it.
  view:
    type: enum
    values: [screen, projection]
    default: screen
  # SBC in-headset cockpit panel: a world-locked console readout composited
  # as a second quad layer (vr_sbc_panel.*). Off by default;
  # when off, the compositor does zero panel work (byte-identical off-state).
  sbc_panel_enable:
    type: bool
    default: false
  # The near-field 3D layer: drawn hands from XR_EXT_hand_tracking (and the
  # controller twin later) as a projection layer between the screen and the
  # SBC panel (docs/vr/nearfield-layer-design.md). Off by default; when off,
  # no swapchain, no layer and no per-frame work beyond one read, so the
  # submitted frames are byte-identical to a build without it.
  hands_mode:
    type: enum
    values: ['off', tracked]
    default: 'off'
  # The near-field layer's render scale: its image is this fraction of the
  # runtime's recommended per-eye size per axis (clamped to 0.25..1; read when
  # the layer is created, once per session). The fov is unchanged, so only the
  # hands' pixel density changes. XEMU_VR_HANDS_SCALE overrides it at start.
  # Default 1 (the full size) until the instrument and the owner's eyes clear a
  # lower one; 0.5 is the candidate
  # (docs/vr/nearfield-efficiency-finding.md).
  hands_scale:
    type: float
    default: 1.0
  # What the tracked hands are drawn as: capsules from the joints (the
  # default) or the glTF glove pair skinned on the CPU to the same 26 joints
  # (hw/xbox/nv2a/pgraph/vk/vr_hands_gltf.c). Read when the near-field layer
  # is created, once per session; XEMU_VR_HANDS_MODEL=capsules|glove
  # overrides it at start. A glove file the loader refuses is logged and the
  # capsules are drawn instead.
  hands_model:
    type: enum
    values: [capsules, glove]
    default: capsules
  sbc_panel_anchor:
    type: enum
    values: [console, screen, world]
    default: console
  sbc_panel_distance:
    type: float
    default: 0.75
  sbc_panel_drop:
    type: float
    default: 0.40
  sbc_panel_tilt_deg:
    type: float
    default: 35.0
  sbc_panel_width_m:
    type: float
    default: 0.50

display:
  renderer:
    type: enum
    values: ["NULL", OPENGL, VULKAN]
    default: OPENGL
  vulkan:
    validation_layers: bool
    debug_shaders: bool
    assert_on_validation_msg: bool
    preferred_physical_device: string
  quality:
    surface_scale:
      type: integer
      default: 1
  filtering:
    type: enum
    values: [linear, nearest]
    default: linear
  window:
    fullscreen_on_startup: bool
    fullscreen_exclusive: bool
    startup_size:
      type: enum
      values: [last_used, 640x480, 720x480, 1280x720, 1280x800, 1280x960, 1920x1080, 2560x1440, 2560x1600, 2560x1920, 3840x2160]
      default: 1280x960
    last_width:
      type: integer
      default: 640
    last_height:
      type: integer
      default: 480
    vsync:
      type: bool
      default: true
  ui:
    show_menubar:
      type: bool
      default: true
    show_notifications:
      type: bool
      default: true
    hide_cursor:
      type: bool
      default: true
    use_animations:
      type: bool
      default: true
    fit:
      type: enum
      values: [center, scale, stretch]
      default: scale
    aspect_ratio:
      type: enum
      values: [native, auto, 4x3, 16x9]
      default: auto
    scale:
      type: float
      default: 1
    auto_scale:
      type: bool
      default: true
    sbc_overlay:
      # Steel Battalion cockpit input overlay (desktop mirror).
      enable:
        type: bool
        default: false
      corner:
        type: enum
        values: [top_left, top_right, bottom_left, bottom_right]
        default: bottom_right
      opacity:
        type: float
        default: 0.85
      show_key_labels:
        type: bool
        default: true
      show_all_controls:
        type: bool
        default: false
      toggle_scancode:
        type: integer
        default: 60 # F3
  debug:
    video:
      transparency:
        type: bool
        default: false
      x_pos:
        type: number
        default: 100.0
      y_pos:
        type: number
        default: 100.0
      x_winsize:
        type: number
        default: 600.0
      y_winsize:
        type: number
        default: 150.0
      advanced_tree_state:
        type: bool
        default: false
  setup_nvidia_profile:
    type: bool
    default: true

audio:
  vp:
    num_workers:
      type: integer
      default: 0  # 0 = auto
  use_dsp: bool
  use_dsp_jit:
    type: bool
    default: true
  hrtf:
    type: bool
    default: true
  volume_limit:
    type: number
    default: 1

net:
  enable: bool
  backend:
    type: enum
    values: [nat, udp, pcap]
    default: nat
  pcap:
    netif: string
  udp:
    bind_addr:
      type: string
      default: 0.0.0.0:9368
    remote_addr:
      type: string
      default: 1.2.3.4:9368
  nat:
    forward_ports:
      type: array
      items:
        host: integer
        guest: integer
        protocol:
          type: enum
          values: [tcp, udp]
          default: tcp

sim:
  # The Sim Configurator (B-SHIP-1, S-55; the owner, 2026-11-14): the games whose plain Boot opens the Sim
  # Configurator first ("Always open in Sim Configurator" in the Games list's right-click menu), by the XBE
  # title id read from the disc image (8 upper-case hex digits, e.g. 43430002). Written only by PenguinBox.
  always_open:
    type: array
    items:
      title_id: string
  # The Sim Configurator's command line (empty: `sim-configurator` on PATH, else the flatpak
  # com.penguinvrlabs.simconfigurator). The hand-off's flags are appended. XEMU_SIM_CONFIGURATOR_CMD overrides it.
  configurator_command: string

sys:
  mem_limit:
    type: enum
    values: ['64', '128']
    default: '64'
  avpack:
    type: enum
    values: [scart, hdtv, vga, rfu, svideo, composite, none]
    default: hdtv
  files:
    bootrom_path: string
    flashrom_path: string
    eeprom_path: string
    hdd_path: string
    dvd_path: string

perf:
  hard_fpu:
    type: bool
    default: true
  cache_shaders:
    type: bool
    default: true
