# Logitech G923 Racing Wheel, Xbox/PC version: the wheel itself (the pedals are device_g923_pedals).
# Art: devices/art/g923_xbox.svg, an original schematic (docs/decisions.md S-21); positions match g923_ps.svg.
# Since 2026-10-10 those shared positions follow the owner's PlayStation unit (View, Menu and the Xbox button on the
# lower spoke); this Xbox version's own layout is NOT checked against a unit.
# USB IDs: from the USB-ID database, NOT read off a unit (docs/hardware/usb-id-crossref.md). The owner will not get
# this wheel (2026-10-10: "fill it in with the DB we found until a community member can correct us"):
#   046d:c26e (`match`): SDL's list (line 565, "Logitech G923") and the Linux kernel's hid-ids.h line 949
#     (USB_DEVICE_ID_LOGITECH_G923_XBOX_WHEEL); two lineages. That it is the PC switch position is INFERRED (the kernel
#     drives it as HID), so no mode is given.
#   046d:c26d (`match_also`): SDL's list only (line 564, "Logitech G923 (Xbox)"); one lineage.
# A community member with this wheel: run tools/usb-ids.sh in each switch position and send the output.
# UNSURE: this version may carry buttons beyond the G920-style set listed here; none is invented. Add any the
# owner finds with press-to-identify.
# The Driving Force shifter and the pedals plug into this wheel base (INFERRED: they report through it).
schema: sim-profile/1
kind: device
id: g923_xbox
name: "Logitech G923 for Xbox and PC"
source: sdl_joystick
match: { vid: 0x046d, pid: 0xc26e }
match_also:
  - { vid: 0x046d, pid: 0xc26d }
art: devices/art/g923_xbox.svg
# Input ids name a control's position or function; the real button and axis codes are captured on
# the owner's hardware with press-to-identify (work/0009, work/0010), and the descriptor ranges are
# placeholders until then. Anchors are points in the art's viewBox.
inputs:
  # Wheel and paddles
  - { id: steering, kind: axis, min: -32768, rest: 0, max: 32767, anchor: [300, 45], label: "Steering wheel" }
  - { id: paddle_left, kind: button, anchor: [164, 160], label: "Left paddle (shift down)" }
  - { id: paddle_right, kind: button, anchor: [436, 160], label: "Right paddle (shift up)" }
  # Shared by both versions; labels are this version's legends
  - { id: dpad, kind: hat, anchor: [210, 210], label: "D-pad" }
  - { id: face_top, kind: button, anchor: [390, 193], label: "Y" }
  - { id: face_left, kind: button, anchor: [371, 212], label: "X" }
  - { id: face_right, kind: button, anchor: [409, 212], label: "B" }
  - { id: face_bottom, kind: button, anchor: [390, 231], label: "A" }
  - { id: hub_upper_left, kind: button, anchor: [300, 342], label: "View" }
  - { id: hub_upper_right, kind: button, anchor: [300, 358], label: "Menu" }
  - { id: spoke_left_lower, kind: button, anchor: [220, 268], label: "LSB" }
  - { id: spoke_right_lower, kind: button, anchor: [380, 268], label: "RSB" }
  - { id: hub_bottom, kind: button, anchor: [300, 375], label: "Xbox button" }
outputs:
  # Force feedback. gain and clamp are conservative starting values, not tuned (brief section 8).
  - { transport: sdl_haptic, effects: [constant, spring], gain: 0.35, clamp: 0.8, invert: false }
