# Logitech G923 pedals: clutch, brake, throttle. The same pedal unit ships with the PlayStation and the Xbox
# wheel. Art: devices/art/g923_pedals.svg, an original schematic (docs/decisions.md S-21).
# The pedals plug into the wheel base, not into USB: on the rig (2026-10-10) the PlayStation/PC wheel in PC mode
# is one input node, 046d:c266, with ABS_X, Y, Z, RZ and no other Logitech node (OBSERVED), so the pedals are axes of
# that unit and `match` names it. The Xbox wheel's IDs (046d:c26e, 046d:c26d) are in `match_also` from the USB-ID
# database, not a unit (see device_g923_xbox.yaml); that its pedals report through it the same way is INFERRED.
# Which axis is which pedal, OBSERVED on the owner's unit in PC mode (evtest, 2026-10-10; the owner pressed the clutch
# once, the brake twice and the throttle three times, so the count names the axis whatever the order;
# tests/fixtures/evtest/rig_2026-10-10_g923_pedals_counted.txt): clutch = ABS_Y (code 1), brake = ABS_RZ (5),
# throttle = ABS_Z (2), each 0..255, resting at 255 (released) and 0 fully pressed: inverted, so `rest` is the top.
# Joystick profiles carry no codes yet (work/0010); these comments are the codes for that work.
schema: sim-profile/1
kind: device
id: g923_pedals
name: "Logitech G923 pedals"
source: sdl_joystick
match: { vid: 0x046d, pid: 0xc266, mode: "PC mode" }
match_also:
  - { vid: 0x046d, pid: 0xc267, mode: "PS4 or PS5 mode" }
  - { vid: 0x046d, pid: 0xc26e }
  - { vid: 0x046d, pid: 0xc26d }
art: devices/art/g923_pedals.svg
# Input ids name a control's position or function; the real button and axis codes are captured on
# the owner's hardware with press-to-identify (work/0009, work/0010), and the descriptor ranges are
# placeholders until then. Anchors are points in the art's viewBox.
inputs:
  - { id: clutch, kind: axis, code: 1, min: -32768, rest: 32767, max: 32767, anchor: [147, 62], label: "Clutch" }  # ABS_Y
  - { id: brake, kind: axis, code: 5, min: -32768, rest: 32767, max: 32767, anchor: [250, 64], label: "Brake" }  # ABS_RZ
  - { id: throttle, kind: axis, code: 2, min: -32768, rest: 32767, max: 32767, anchor: [370, 78], label: "Throttle" }  # ABS_Z
