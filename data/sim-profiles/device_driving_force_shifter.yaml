# Logitech Driving Force Shifter: a 6-speed H-pattern; reverse is the knob pushed down and moved into the 6th
# gear position (INFERRED from general knowledge: check on the hardware). Each gear is its own button, which is
# how a wheel base usually reports it; device_shifter (the TH8A fixture) shows the detent form instead.
# Art: devices/art/driving_force_shifter.svg, an original schematic from above; the H-gate is drawn as a
# diagram, the gear anchors sit on the gate ends, reverse on the knob. The housing (keyhole outline, clamp cap in
# front, knob in its boot behind, a round bump either side) was checked by eye against the owner's photo
# (2026-10-10, not in the repo); the bumps carry no input in this profile.
# It plugs into the G923 wheel base, not into USB: on the bus its gears are likely buttons of the wheel device
# (INFERRED), unlike a TH8A, which enumerates on its own (brief section 5).
schema: sim-profile/1
kind: device
id: driving_force_shifter
name: "Logitech Driving Force Shifter"
source: sdl_joystick
art: devices/art/driving_force_shifter.svg
# Input ids name a control's position or function; the real button and axis codes are captured on
# the owner's hardware with press-to-identify (work/0009, work/0010), and the descriptor ranges are
# placeholders until then. Anchors are points in the art's viewBox.
inputs:
  - { id: gear_1, kind: button, anchor: [155, 205], label: "Gear 1" }
  - { id: gear_2, kind: button, anchor: [155, 319], label: "Gear 2" }
  - { id: gear_3, kind: button, anchor: [200, 205], label: "Gear 3" }
  - { id: gear_4, kind: button, anchor: [200, 319], label: "Gear 4" }
  - { id: gear_5, kind: button, anchor: [245, 205], label: "Gear 5" }
  - { id: gear_6, kind: button, anchor: [245, 319], label: "Gear 6" }
  - { id: gear_reverse, kind: button, anchor: [200, 262], label: "Reverse (push the knob down, then into 6th)" }
