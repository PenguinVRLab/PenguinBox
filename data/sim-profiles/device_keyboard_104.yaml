# A standard ANSI 104-key keyboard as a device (work/0019). Every input is a `button` whose `scancode` is its Linux
# evdev key code (the `code` of an EV_KEY event, as evtest prints it). Each code is cited to
# /usr/include/linux/input-event-codes.h (the Linux 5.14 UAPI header on the dev box, read 2026-10-09) by KEY_ name
# and line; the same values are in the kernel source, include/uapi/linux/input-event-codes.h. The codes are the
# kernel's fixed ABI, the same on every Linux machine; the line numbers are this header's.
# Ids are the KEY_ names in lower case. Art: devices/art/keyboard_104.svg, an original schematic generated from
# the same key-layout table; anchors are key centres, and each keycap is a rect with id `key_<name>` in the art
# (the canvas draws every key as a region from those bounds). A non-US layout prints other legends on some keys;
# the codes (positions) are the same.
schema: sim-profile/1
kind: device
id: keyboard_104
name: "Keyboard (104-key)"
source: keyboard
art: devices/art/keyboard_104.svg
