# PenguinBox flatpak manifest.
#
# Adapted from the official Flathub xemu manifest (flathub/app.xemu.xemu). The
# `xemu` module builds THIS source tree (type: dir) instead of a xemu release
# tarball, so the flatpak contains the PenguinBox fork. The app id is the
# product's own, com.penguinvrlabs.penguinbox: it keys the per-app data folder
# (~/.var/app/com.penguinvrlabs.penguinbox) and never collides with an installed
# upstream xemu flatpak.
#
# Built by:  ./build-release.sh linux   (from the released source tree; the
#            release tooling fills in the sandbox permissions and the
#            metainfo at release time)
#
app-id: com.penguinvrlabs.penguinbox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: xemu
finish-args:
  # the GPU, game controllers, and the Steel Battalion controller's USB device (libusb)
  - --device=all
  # networking: System Link over UDP, and the guest's NAT network
  - --share=network
  # audio
  - --socket=pulseaudio
  # the window: X11 on every desktop (Xwayland on a Wayland desktop), the path PenguinBox is tested on
  - --socket=x11
  # the window: SDL uses X11, the tested path
  - --env=SDL_VIDEODRIVER=x11
  # X11 shared memory
  - --share=ipc
  # VR: the built-in Monado leases the headset's display through the desktop's Wayland
  - --socket=wayland
  # Steam Game Mode: gamescope's display socket
  - --filesystem=xdg-run/gamescope-0:ro
  # openSUSE sets QEMU_AUDIO_DRV=pa, which stops xemu launching
  - --unset-env=QEMU_AUDIO_DRV
  # device hotplug: a controller plugged in after start (the udev database)
  - --filesystem=/run/udev:ro
  # VR: the user's active OpenXR runtime (~/.config/openxr)
  - --filesystem=xdg-config/openxr:ro
  # VR: WiVRn's socket
  - --filesystem=xdg-run/wivrn
  # VR: WiVRn's data folder
  - --filesystem=~/.var/app/io.github.wivrn.wivrn:ro
  # VR: WiVRn's runtime library and manifest, WiVRn installed for the user
  - --filesystem=~/.local/share/flatpak/app/io.github.wivrn.wivrn:ro
  # VR: WiVRn's runtime library and manifest, WiVRn installed system-wide
  - --filesystem=/var/lib/flatpak/app/io.github.wivrn.wivrn:ro
  # VR: a Monado service running outside the sandbox
  - --filesystem=xdg-run/monado_comp_ipc
  # VR: the Monado built into this flatpak; its service runs as a second instance of the app
  - --filesystem=xdg-run/penguinbox-monado
  # VR: a custom Monado build for the PS VR2
  - --filesystem=~/opt/monado-psvr2:ro
  # VR: a custom Monado build for display glasses
  - --filesystem=~/opt/monado-penguinlens:ro
  # VR: the same, by its older name
  - --filesystem=~/opt/monado-glasses:ro
  # VR: the PS VR2 Monado built in a distrobox (SteamOS)
  - --filesystem=~/distrobox/monado/opt/monado-psvr2:ro
  # VR: the glasses Monado built in a distrobox
  - --filesystem=~/distrobox/monado/opt/monado-penguinlens:ro
  # VR: the same, by its older name
  - --filesystem=~/distrobox/monado/opt/monado-glasses:ro
  # your files: the Xbox BIOS, MCPX boot ROM and flash images
  - --filesystem=~/Xbox-BIOS:create
  # your files: Xbox hard disk images (written by the console)
  - --filesystem=~/Xbox-HDD:create
  # your files: game disc images
  - --filesystem=~/Xbox-Games:create
  # the Sim Configurator: its shared profile store (profiles/ and handoff/), read and written by the hand-off
  - --filesystem=xdg-data/sim-configurator:create
  # the Sim Configurator's D-Bus activation (contract at sim-configurator 0fe2110; recheck when it merges)
  - --talk-name=com.penguinvrlabs.simconfigurator

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'

modules:
  - name: libpcap
    buildsystem: cmake-ninja
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.tcpdump.org/release/libpcap-1.10.6.tar.gz
        sha256: 872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9

  - name: libslirp
    buildsystem: meson
    # flatpak-builder older than 1.4.9 passes meson no --libdir, so the library and
    # slirp.pc land in /app/lib64, where xemu's configure does not look; it then falls
    # back to the slirp wrap and fails offline (ISS-B47). Build only with 1.4.9 or later
    # (the shared builder's pinned image), which passes --libdir=/app/lib itself; a
    # -Dlibdir here as well fails with "Got argument libdir as both -Dlibdir and --libdir".
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.gz
        sha256: 3970542143b7c11e6a09a4d2b50f30a133473c41f15ed0bdcc3b7a1c450d9a5c

  # Build-time Python for xemu's configure (genconfig imports yaml). configure makes its own
  # venv, which sees the SDK's site-packages but not /app's, so these go to one fixed folder
  # the xemu module puts on PYTHONPATH, and the folder is cleaned out of the shipped app.
  - name: PyYAML
    buildsystem: simple
    build-commands:
      - pip install --target=/app/lib/python-site --no-build-isolation .
    cleanup:
      - /lib/python-site
    sources:
      - type: archive
        url: https://github.com/yaml/pyyaml/archive/refs/tags/6.0.3.tar.gz
        sha256: c7b45011e052458ae79015d5eea3046c37d099023d4b253dde26ee1c29ea2f36

  - name: distlib
    buildsystem: simple
    build-commands:
      - pip install --target=/app/lib/python-site --no-build-isolation .
    cleanup:
      - /lib/python-site
    sources:
      - type: archive
        url: https://github.com/pypa/distlib/archive/refs/tags/0.4.3.tar.gz
        sha256: 421a2a177a9c6a725d821c27e69e9e06429dd6b9d9c44c51689412fb61936b51

  - name: xxhash
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.3.tar.gz
        sha256: aae608dfe8213dfd05d909a57718ef82f30722c392344583d3f39050c7f29a80

  # SDL3 (window, sound, gamepads): the same release as subprojects/sdl3.wrap, the copy the
  # AppImage and the NAS builds use, so the flatpak does not take the runtime's older SDL3
  # (xemu's meson.build looks for a system sdl3 first; /app's comes before the runtime's).
  # Same switches as meson.build's bundled build, shared instead of static (as PenguinScreen2's
  # flatpak builds its own SDL3). Keep the url and sha256 equal to the wrap's.
  - name: sdl3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_CAMERA=OFF
      - -DSDL_DISKAUDIO=OFF
      - -DSDL_DUMMYVIDEO=OFF
      - -DSDL_FRIBIDI=OFF
      - -DSDL_GPU=OFF
      - -DSDL_HAPTIC=OFF
      - -DSDL_LIBTHAI=OFF
      - -DSDL_POWER=OFF
      - -DSDL_RENDER=OFF
      - -DSDL_SENSOR=OFF
      - -DSDL_TRAY=OFF
      - -DSDL_VIRTUAL_JOYSTICK=OFF
      - -DSDL_X11_XTEST=OFF
    cleanup:
      - /bin
      - /lib/cmake
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
        sha256: 12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785

  # VR: the OpenXR loader PenguinBox loads at start, and the PS VR2 stack
  # (RADV at a known Mesa version, and Monado with its PS VR2 driver).
  # WiVRn is not bundled: it is its own flatpak, reached through sandbox holes.
  - modules/openxr-loader.yml
  - modules/mesa-radv.yml
  - modules/monado.yml

  - name: xemu
    buildsystem: autotools
    builddir: true
    no-make-install: true
    build-options:
      cflags: -O3 -DXBOX=1 -Wno-error=redundant-decls
      env:
        PYTHONPATH: /app/lib/python-site
    config-opts:
      - --audio-drv-list=sdl
      - --disable-werror
      - --target-list=i386-softmmu
      # USB passthrough (the Steel Battalion controller) needs libusb: required, so a
      # runtime without it fails configure instead of building a flatpak without USB
      - --enable-libusb
      # D-Bus through libgio (glib's, in the runtime): the Sim Configurator's
      # activation route is built only with it; required, so it cannot silently
      # fall back to the stub that answers "not found"
      - --enable-gio
      # the build sandbox has no network: every subproject is already in the source
      # tree, and a missing one is an error instead of a download
      - --disable-download
      # the release options (build-release.sh RELEASE_OPTS; it refuses a mismatch)
      - --enable-lto
      - -Dx86_version=3
      - --extra-cflags=-mtune=znver2
      - --extra-cflags=-mno-needed
    make-args:
      - qemu-system-i386
    post-install:
      - |-
        for px in 16 32 48 64 128 256 512; do
          install -Dm644 ../ui/icons/xemu_${px}x${px}.png $FLATPAK_DEST/share/icons/hicolor/${px}x${px}/apps/${FLATPAK_ID}.png
        done
      # PNG icons only, as PenguinScreen2's flatpak: the build image has no SVG loader for
      # gdk-pixbuf, so a scalable SVG here fails flatpak-builder's appstreamcli compose
      # ("file-read-error ... Unrecognized image file format")
      - install -Dm644 ../flatpak/penguinbox.desktop $FLATPAK_DEST/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-validate $FLATPAK_DEST/share/applications/${FLATPAK_ID}.desktop
      - mv qemu-system-i386 $FLATPAK_DEST/bin/xemu
      # GPLv2 and the bundled libraries' licences, under the app id's licence folder
      - install -Dm644 ../COPYING $FLATPAK_DEST/share/licenses/${FLATPAK_ID}/COPYING
      - cd .. && python3 scripts/gen-license.py > $FLATPAK_DEST/share/licenses/${FLATPAK_ID}/LICENSE.txt
      # the metainfo is generated from flatpak/penguinbox.metainfo.xml.in, with the
      # release's version and date, when the source tree is released
      - install -Dm644 ../flatpak/com.penguinvrlabs.penguinbox.metainfo.xml $FLATPAK_DEST/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # PenguinBox fork — build this working tree, not a xemu release tarball.
      - type: dir
        path: ..
        skip:
          - build
          - dist
          - .git
          - .flatpak-builder
      # dsp56300's prebuilt library: subprojects/dsp56300/meson.build downloads it
      # at configure time when it is not beside that file, so it is a pinned source
      - type: file
        url: https://github.com/mborgerson/dsp56300/releases/download/v0.1.3/dsp56300-0.1.3-x86_64-unknown-linux-gnu.tar.gz
        sha256: 04aff4e070913205a7913d8d8a6076f99150c347d21df584b76b436ed5170fc8
        dest: subprojects/dsp56300
